# Weekly Dependabot updates: GitHub Actions, NuGet (grouped) and the app Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # A new release waits three days before Dependabot proposes it, except the lktec-bot
    # workflows: those are our own and a fix there should reach every caller right away.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/lktec-bot*"
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # Same for the lktec-bot workflows (automerge, lockfiles, release): one PR per release.
      lktec-bot:
        patterns:
          - "lukislp/lktec-bot*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
      # SkiaSharp only loads its matching native assets - bump them together.
      skiasharp:
        patterns: ["SkiaSharp*", "HarfBuzzSharp*"]
    ignore:
      # NotifyHub comes from the committed flat-folder feed in
      # UnifiCameraDashboard/nuget-packages, not from a public registry - Dependabot cannot see
      # its GitHub Releases, so it is bumped by hand (see that folder's README). Ignoring it also
      # closes a dependency-confusion path: the id is unregistered on nuget.org, so anything that
      # ever shows up there under this name would be a stranger's package, not an upgrade.
      - dependency-name: "NotifyHub"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  - package-ecosystem: docker
    directory: /UnifiCameraDashboard
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
