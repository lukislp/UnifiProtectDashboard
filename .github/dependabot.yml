# Weekly Dependabot updates: GitHub Actions, NuGet (grouped) and the app Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: docker
    directory: /UnifiCameraDashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
