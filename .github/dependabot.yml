# Weekly Dependabot updates: GitHub Actions, NuGet (grouped) and the app Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
    ignore:
      # NotifyHub comes from the committed flat-folder feed in
      # UnifiCameraDashboard/nuget-packages, not from a public registry - Dependabot cannot see
      # its GitHub Releases, so it is bumped by hand (see that folder's README). Ignoring it also
      # closes a dependency-confusion path: the id is unregistered on nuget.org, so anything that
      # ever shows up there under this name would be a stranger's package, not an upgrade.
      - dependency-name: "NotifyHub"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  - package-ecosystem: docker
    directory: /UnifiCameraDashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"
    reviewers:
      - "lukislp"
