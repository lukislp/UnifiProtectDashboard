name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  IMAGE: ghcr.io/lukislp/unifiprotectdashboard

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'UnifiCameraDashboard.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Download NotifyHub nupkg (not on nuget.org - see UnifiCameraDashboard/nuget-packages/README.md)
        run: |
          mkdir -p UnifiCameraDashboard/nuget-packages
          curl -fsSL -o UnifiCameraDashboard/nuget-packages/NotifyHub.0.2.2.nupkg https://github.com/lukislp/NotifyHub/releases/download/v0.2.2/NotifyHub.0.2.2.nupkg
      - run: dotnet restore UnifiCameraDashboard.sln
      - run: dotnet build UnifiCameraDashboard.sln --configuration ${{ env.CONFIGURATION }} --no-restore
      - run: dotnet test UnifiCameraDashboard.sln --configuration ${{ env.CONFIGURATION }} --no-build

  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'UnifiCameraDashboard.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Download NotifyHub nupkg (not on nuget.org - see UnifiCameraDashboard/nuget-packages/README.md)
        run: |
          mkdir -p UnifiCameraDashboard/nuget-packages
          curl -fsSL -o UnifiCameraDashboard/nuget-packages/NotifyHub.0.2.2.nupkg https://github.com/lukislp/NotifyHub/releases/download/v0.2.2/NotifyHub.0.2.2.nupkg
      - run: dotnet format UnifiCameraDashboard.sln --verify-no-changes --verbosity diagnostic

  test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'UnifiCameraDashboard.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Download NotifyHub nupkg (not on nuget.org - see UnifiCameraDashboard/nuget-packages/README.md)
        run: |
          mkdir -p UnifiCameraDashboard/nuget-packages
          curl -fsSL -o UnifiCameraDashboard/nuget-packages/NotifyHub.0.2.2.nupkg https://github.com/lukislp/NotifyHub/releases/download/v0.2.2/NotifyHub.0.2.2.nupkg
      - run: dotnet restore UnifiCameraDashboard.sln
      - run: |
          dotnet list UnifiCameraDashboard.sln package --vulnerable --include-transitive --format json > nuget-vulnerabilities.json
          cat nuget-vulnerabilities.json
          python3 -c "
          import json, sys

          def find_severities(obj):
              if isinstance(obj, dict):
                  if 'severity' in obj:
                      yield obj['severity']
                  for v in obj.values():
                      yield from find_severities(v)
              elif isinstance(obj, list):
                  for item in obj:
                      yield from find_severities(item)

          data = json.load(open('nuget-vulnerabilities.json'))
          severities = set(find_severities(data))
          high_or_critical = {'High', 'Critical'} & severities
          if high_or_critical:
              print(f'::error::High or Critical severity vulnerability found: {sorted(high_or_critical)}')
              sys.exit(1)
          elif severities:
              print(f'NuGet advisory findings detected (severities: {sorted(severities)}) - none High/Critical, not failing the build.')
          else:
              print('No known vulnerable NuGet packages found.')
          "
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-vulnerabilities
          path: nuget-vulnerabilities.json
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / docker / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    # No separate "build" job here - test-build already compiles the solution, and rebuilding
    # it again here added no new signal, just wait time.
    needs: [test-build, test-lint, test-security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: unifiprotectdashboard-release-chain
      cancel-in-progress: false
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely - confirmed
    # live on the studylife-ai sibling repo (2026-08-12).
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. Downstream jobs below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  docker-smoke-check:
    # Split out from docker-build-push so the matrix job below stays uniform across platforms
    # (no per-leg conditionals) - this still gates the real push exactly like before, just as
    # its own job. amd64 only, matching this runner; reuses the exact endpoint
    # docker-compose.yml's own healthcheck already relies on.
    needs: [get-version, semantic-release]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./UnifiCameraDashboard
          load: true
          tags: unifiprotectdashboard:smoke-check
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Smoke-check the built image
        run: |
          docker run -d --name unifiprotectdashboard-smoke -p 5003:5003 unifiprotectdashboard:smoke-check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5003/api/ping > /dev/null; then
              echo "container is healthy"
              docker rm -f unifiprotectdashboard-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs unifiprotectdashboard-smoke
          docker rm -f unifiprotectdashboard-smoke
          exit 1

  docker-build-push:
    # Runs after semantic-release (not before, see that job) - so a build/push failure here
    # never leaves an orphaned, un-tagged GHCR image blocking every future release via the
    # duplicate-tag guard below (the exact incident already hit twice elsewhere in this
    # portfolio - see studylife-ai/studylife docs/decisions.md "CI incident").
    #
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # emulated arm64 (a .NET publish with native ONNX Runtime/SkiaSharp deps) was the dominant
    # cost of the whole pipeline (~13 of ~15 total minutes). ubuntu-24.04-arm is a real arm64
    # GitHub-hosted runner (free for public repos), so that leg now builds at native speed
    # instead of under emulation. Each leg pushes its own image by digest only (no tag yet) -
    # docker-manifest-merge below stitches the two digests into the actual multi-arch
    # :latest/:$NEXT_VERSION tags, same end result as the old single multi-platform build.
    needs: [get-version, semantic-release, docker-smoke-check]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./UnifiCameraDashboard
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    # Stitches the two per-platform digests pushed above into one real multi-arch manifest
    # under the actual tags - the matrix job above deliberately never tags anything itself
    # (push-by-digest only), so :latest/:$NEXT_VERSION don't exist in the registry until this
    # job runs. Standard docker/build-push-action multi-platform-via-matrix pattern.
    needs: [get-version, docker-build-push]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"

  trivy-scan:
    needs: [get-version, docker-manifest-merge]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: unifiprotectdashboard-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  semantic-release:
    # Runs before docker-build-push now (see that job's comment) - the real tag/release must
    # exist before anything is published under that version.
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: unifiprotectdashboard-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between
      # this job's checkout and its own push (the concurrency group above already serializes
      # overlapping runs of this workflow, so this only guards against a genuinely external push).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
