# Deliberately ONLY this file - NOT the rest of k8s/. Mirrors studylife-mcp's own
# k8s/flux-deploy/kustomization.yaml scoping: kustomize-controller's least-privilege ClusterRole
# (studylife repo's k8s/flux/06-reconciler-rbac.yaml) only grants permissions on
# Deployments/Services/PersistentVolumeClaims - NOT Namespaces, NetworkPolicies, or the Gateway
# API resource kinds, all of which this repo's k8s/ also has (00-namespace.yaml,
# 02-httproute.yaml, 03-network-policies.yaml). Those stay bootstrap-only, applied once by hand;
# Flux continuously reconciles exactly this subset (PVC + Deployment + Service, all three
# defined together in ../01-app.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../01-app.yaml
