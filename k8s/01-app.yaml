# S2 measurement deployment - pinned to pinode02 (the real 8GB Pi with headroom; pinode01 is the
# control-plane node, already tight on memory). No Kubernetes Secret for Protect credentials: the
# app stores them itself, AES-encrypted in its own SQLite DB, entered once via the Setup wizard
# (same as every local test this whole project went through) - so first-time setup here is:
# kubectl port-forward, open the wizard once, done.
#
# This file is Flux-managed via k8s/flux-deploy/kustomization.yaml, which applies exactly this
# file - the studylife repo's k8s/flux/21-25-unifiprotectdashboard-*.yaml watch GHCR for new tags
# and auto-bump the $imagepolicy-marked image line below. The Namespace/HTTPRoute/NetworkPolicy
# files in this same k8s/ folder stay bootstrap-only (applied once by hand), same split as
# studylife-mcp/piwatch - see k8s/flux-deploy/kustomization.yaml for why.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifiprotectdashboard-data
  namespace: unifiprotectdashboard
spec:
  # ReadWriteMany + Longhorn (NFS-backed share-manager, cross-node-replicated, see
  # homelab-infra/cluster/11-longhorn-values.yaml) instead of local-path's RWO. local-path's
  # RWO was only node-scoped (not truly pod-exclusive), which the RollingUpdate strategy
  # below relies on to let the surge pod mount concurrently with the outgoing one - Longhorn's
  # RWO enforces single-pod-exclusive, so it would break that overlap. RWX replicates the same
  # concurrent-mount behavior properly (even across nodes, not just same-node), and the app's
  # own InstanceLock (Services/InstanceLock.cs) already handles single-writer safety
  # independent of the storage layer either way.
  accessModes: ["ReadWriteMany"]
  storageClassName: longhorn
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifiprotectdashboard
  namespace: unifiprotectdashboard
  labels: {app: unifiprotectdashboard}
spec:
  replicas: 1
  strategy:
    # RollingUpdate (not Recreate) so the web UI stays reachable through a rollout: the new pod
    # comes up and starts serving traffic BEFORE the old one is terminated. This only works
    # safely with a single-writer SQLite file because of two things together: (1) nodeSelector
    # below pins every replica to the same node, and the PVC's local-path StorageClass is a
    # hostPath bind-mount - both pods can mount it concurrently without an RWX volume; (2) the
    # app itself gates its write-active background services (event ingestion, classification)
    # behind a file lock (see Services/InstanceLock.cs) so only one pod's copy of those actually
    # runs at a time - the new pod serves reads immediately but waits for the old pod to
    # actually stop (releasing the lock) before it starts writing. maxUnavailable: 0 keeps the
    # old pod up until the new one is ready; maxSurge: 1 is the only way to get an overlap at
    # replicas: 1.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: unifiprotectdashboard}
  template:
    metadata:
      labels: {app: unifiprotectdashboard}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup (cluster/10-velero-values.yaml
        # there): /data holds dashboard.db plus enc.key (encrypts the stored UniFi
        # credentials) and vapid-keys.json (push subscriptions) - the two key files are
        # irreplaceable, without them it's a full re-setup including every push subscriber.
        backup.velero.io/backup-volumes: data
    spec:
      # Pinned to the real 8GB node this measurement is about - not left to the scheduler.
      nodeSelector:
        kubernetes.io/hostname: pinode02
      initContainers:
        # The PVC's data (SQLite db, encryption key, thumbnails) was written
        # by the image's root era; chown on every start - idempotent - so the
        # non-root app below can keep writing it. The only root in the pod.
        - name: fix-data-ownership
          image: busybox:1.36.1
          command: ["chown", "-R", "1654:1654", "/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: unifiprotectdashboard
          # Flux-managed (see k8s/flux-deploy/) - the studylife repo's ImageUpdateAutomation
          # bumps this tag automatically on every new GHCR release, matched via this marker.
          image: ghcr.io/lukislp/unifiprotectdashboard:1.13.3 # {"$imagepolicy": "flux-system:unifiprotectdashboard"}
          env:
            - name: DATA_DIR
              value: /data
            - name: ASPNETCORE_URLS
              value: http://+:5003
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          # The image runs as the aspnet base image's built-in app user (1654)
          # since the same-named Dockerfile change; declared here so the
          # posture is enforced, not incidental.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          ports:
            - containerPort: 5003
          resources:
            # Conservative given pinode02 already runs other real workloads (~51% memory used at
            # last check) - IntraOpNumThreads is already capped to 2 in the classifier itself, so
            # this limit is a backstop, not the primary throttle.
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 2000m, memory: 1536Mi}
          readinessProbe:
            httpGet: {path: /api/ping, port: 5003}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/ping, port: 5003}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: unifiprotectdashboard-data}
---
apiVersion: v1
kind: Service
metadata:
  name: unifiprotectdashboard
  namespace: unifiprotectdashboard
spec:
  type: ClusterIP
  selector: {app: unifiprotectdashboard}
  ports:
    - port: 5003
      targetPort: 5003
